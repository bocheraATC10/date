.you{background:var(--pink);color:#fff;border-color:transparent;text-align:right}
.meter{height:14px;background:var(--soft);border:2px solid var(--line);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9ac8,#ff4f9a);transition:width .6s}
.ml{font-size:.75rem;opacity:.8}
button{font:inherit;cursor:pointer;border:2px solid var(--pink);background:var(--card);color:var(--ink);padding:11px 16px;border-radius:99px;margin:5px 4px;transition:transform .15s,background .15s;touch-action:manipulation}

.ev{z-index:150;white-space:nowrap;transition:left .25s,top .25s,transform .25s}

@keyframes rise{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
#modal{position:fixed;inset:0;z-index:100;background:#000a;display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
.cert{border:4px double var(--pink);border-radius:18px;padding:16px;margin:10px 0;background:var(--soft)}
.stamp{display:inline-block;color:var(--pink);border:3px solid var(--pink);border-radius:10px;padding:2px 10px;font-weight:bold;transform:rotate(-8deg);margin-top:8px}
small{opacity:.75}
body{min-height:100dvh;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{min-height:44px}
#modal:not(.on)~#leave{display:none}
#bg{position:fixed;inset:0;z-index:0}#bg svg{width:100%;height:100%;filter:blur(1.5px) saturate(1.1)}

.fig{position:relative}.fig .sfx{top:2%;right:-6px}
.tb{position:relative;margin:0 4px 14px;padding:8px 10px;border-radius:16px;font-size:.9rem;line-height:1.25;text-align:left;border:2px solid var(--line);background:var(--soft);animation:pop .3s}
.tb:empty{display:none}
.tb::after{content:'';position:absolute;bottom:-10px;left:50%;margin-left:-8px;border:8px solid transparent;border-top:10px solid var(--line);border-bottom:0}

const mouth=wo?`<ellipse cx='60' cy='88' rx='6' ry='8' fill='#5a1e1e'/>`:bl?`<path d='M52 86q8 6 16 0' fill='none' stroke='#2a1810' stroke-width='2.5' stroke-linecap='round'/>`:sm?`<path d='M50 86q10 6 22-4' fill='none' stroke='#2a1810' stroke-width='2.5' stroke-linecap='round'/>`:`<path d='M47 83q13 15 26 0z' fill='#fff' stroke='#2a1810' stroke-width='2'/>`;
return `<svg viewBox='0 0 120 195' xmlns='http://www.w3.org/2000/svg'><defs><linearGradient id='gM' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#3a1a0a'/><stop offset='1' stop-color='#a0642f'/></linearGradient></defs>

let AC,mus=false,mg,nxt=0,stp=0;
const NT=n=>440*Math.pow(2,(n-69)/12),CH=[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,65]],ML=[76,0,79,0,81,79,76,0,72,0,76,0,79,76,72,0,77,0,76,0,72,0,69,72,74,0,71,74,77,0,74,0];
function tone(f,t,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function sched(){if(nxt<AC.currentTime)nxt=AC.currentTime+.05;while(nxt<AC.currentTime+.4){const c=CH[Math.floor(stp/8)%4],m=ML[stp%32];tone(NT(c[stp%4]-12),nxt,.5,'triangle',.07);if(stp%8==0)tone(NT(c[0]-24),nxt,1.2,'sine',.12);if(m)tone(NT(m),nxt,.45,'sine',.09);nxt+=.34;stp++}}
const mb=document.getElementById('mb');
function music(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.8;mg.connect(AC.destination);setInterval(()=>{if(mus)sched()},120)}AC.resume();mus=true;mg.gain.value=.8;mb.textContent='🔊'}
let m0=0;['click','touchend'].forEach(t=>document.addEventListener(t,e=>{if(!m0&&e.target!==mb){m0=1;music()}},true));
mb.onclick=e=>{e.stopPropagation();if(!AC){m0=1;music();return}mus=!mus;mg.gain.value=mus?.8:0;mb.textContent=mus?'🔊':'🔇'};
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():mus&&AC.resume()});

function stage(m,t,sh,mt,yt){const bb=(c,id,x)=>x==null?'':`<div class='tb ${c}'${id?` id='${id}'`:''}>${x}</div>`;return `<div class='stage'><div class='pc'>${bb('m','say',mt)}<div class='fig'>${man(m)}</div></div><div class='pc${sh?' shake':''}'>${bb('y','',yt)}<div class='fig'>${tsun(t)}${SF[t]?`<div class='sfx'>${SF[t]}</div>`:''}</div></div></div>`}

let i=0,meter=0;

function intro(){
  clear();
  app.innerHTML=`${stage("smile","hmph")}<h1>Hey ${FRIEND}… 👉👈</h1><div class="bubble">I have something to ask you. It’s really important. Please answer honestly!</div><h1>Will you go on a date with me? 🥺</h1><div id="btns"></div><small>(Choose carefully~)</small>`;
  const y=document.createElement("button");y.className="main";y.textContent="Yes! 💖";y.onclick=()=>{i=0;meter=0;scene()};
  const n=document.createElement("button");n.textContent="No 💔";
  document.getElementById("btns").append(y,n);
  dodgeable(n,["No 💔","Too slow! 😜","Nope, try again!","Can’t catch me~","Just say yes! 🥺","Why are you like this 😭","Please? 🥹","Stop clicking No!","Baka! 💢","Yes is right there!"]);
  n.addEventListener("pointerenter",()=>{y.style.transform="scale("+Math.min(1.5,1+rnd(.05,.12)*(parseFloat(y.dataset.s||0)+1))+")";y.dataset.s=(+y.dataset.s||0)+1});
}

function scene(){
  clear();
  const s=S[i];
  app.innerHTML=`<small>${s.bg} · Scene ${i+1}/${S.length}</small><div id="stg">${stage('smile','hmph',0,'',null)}</div><div id="cs"></div><div class="meter"><i id="mt" style="width:${meter}%"></i></div><div class="ml">💢 Tsundere level: <b id="tl">${Math.round(meter)}</b>%</div>`;
  const cs=document.getElementById("cs");
  type(document.getElementById("say"),s.line,()=>{
    s.ch.forEach((c,k)=>{
      const b=document.createElement("button");b.className="ch";b.textContent=c[0];b.style.animationDelay=k*.15+"s";
      b.onclick=()=>pick(c);cs.appendChild(b);
    });
  });
}

function pick(c){
  meter=Math.min(100,meter+100/S.length);
  const cs=document.getElementById("cs");
  const k=S[i].ch.indexOf(c),old=document.getElementById('say').textContent;document.getElementById('stg').innerHTML=stage(MX[c[1]]||'smile',S[i].final?'dere':['hmph','blush','dere'][(k+i)%3],1,old,c[0]);
  cs.innerHTML='';
  document.getElementById("mt").style.width=meter+"%";
  document.getElementById("tl").textContent=Math.round(meter);
  setTimeout(()=>{
    type(document.getElementById("say"),c[2],()=>{
      const b=document.createElement("button");b.className="main";b.textContent=i<S.length-1?"Next ▶":"…One more thing 💌";
      b.onclick=()=>{i++;i<S.length?scene():end()};cs.appendChild(b);
    });
  },500);
  for(let k=0;k<12;k++){const h=document.createElement("span");h.textContent="💗";h.style.left=rnd(10,90)+"vw";h.style.fontSize=rnd(20,40)+"px";h.style.animationDuration=rnd(2,4)+"s";fx.appendChild(h);setTimeout(()=>h.remove(),4000)}
}

function end(){
  clear();
  const d=new Date().toLocaleDateString();
  app.innerHTML=`${stage("heart","dere")}<h1>🎉 Official Tsundere Confession 🎉</h1>
  <div class="cert"><p>This certifies that <b>${FRIEND}</b> willingly admitted, in a very tsundere way, that he likes <b>${ME}</b>.</p><p>Date: ${d}<br>Tsundere level: <b>MAX 💢</b><br>Dere level: <b>Suspiciously high 💖</b></p><div class="stamp">100% CONFIRMED</div></div>
  <p>📸 Screenshot this and send it to me, baka!</p><div id="eb"></div>`;
  const a=document.createElement("button");a.className="main";a.textContent="Replay the date 💞";a.onclick=intro;
  const b=document.createElement("button");b.textContent="Actually I didn’t mean it";
  document.getElementById("eb").append(a,b);
  dodgeable(b,["Actually I didn’t mean it","Too late, it’s official!","Nope! It’s in writing!","Screenshot taken 📸","Stop denying it, baka!","💖💖💖"]);
  for(let k=0;k<40;k++)setTimeout(()=>{const h=document.createElement("span");h.textContent=["🎉","💖","🌸","✨"][k%4];h.style.left=rnd(0,100)+"vw";h.style.fontSize=rnd(20,40)+"px";h.style.animationDuration=rnd(3,6)+"s";fx.appendChild(h)},k*80);
}
